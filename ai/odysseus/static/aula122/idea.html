<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aula 122 — Idea</title>
<link rel="stylesheet" href="/static/aula122/aula122-tokens.css">
<link rel="stylesheet" href="/static/aula122/idea.css">
</head>
<body>
<div class="i-main">

  <!-- App bar (calcada del diseño) -->
  <div class="i-appbar">
    <span class="title">Idea / Tratamiento</span>
    <span class="spacer"></span>
    <button id="tb-ia" class="a122-btn--text" title="Rita ayuda a expandir el argumento o el tratamiento"><span class="mi">auto_awesome</span> Desarrollar con IA</button>
    <button id="tb-edit" class="a122-btn" title="Editar en el editor nativo">Editar</button>
  </div>

  <!-- Documentos de desarrollo: Sinopsis (argumento) + Tratamiento -->
  <div class="dev-tabs" id="dev-tabs">
    <button class="dev-tab" data-doc="sinopsis">Sinopsis</button>
    <button class="dev-tab is-active" data-doc="tratamiento">Tratamiento</button>
  </div>

  <div class="dev-body">

    <!-- Página de prosa: aquí se ve el argumento / tratamiento real del .starc.
         Doble clic = abrir el editor nativo al lado. -->
    <div class="doc-area" id="doc-area" title="Doble clic para editar en el editor nativo">
      <div class="prose"><div class="empty">Cargando…</div></div>
    </div>

    <!-- Metadatos del proyecto (calcado del diseño) -->
    <aside class="meta">
      <div class="a122-card">
        <label>Título</label>
        <div class="val" id="meta-titulo">—</div>
      </div>
      <div class="a122-card">
        <label>Sinopsis</label>
        <div class="val muted" id="meta-sinopsis"><i>—</i></div>
      </div>
      <div class="a122-card">
        <label>Tratamiento</label>
        <div class="val muted" id="meta-tratamiento"><i>—</i></div>
      </div>
      <div class="a122-card">
        <label>Documentos de desarrollo</label>
        <div class="val muted t-caption">Sinopsis (argumento) y Tratamiento del proyecto. Se editan en el editor nativo.</div>
      </div>
      <div class="a122-card">
        <label>Moodboard</label>
        <div class="mood"><div>＋ imagen</div><div>＋ imagen</div><div>＋ imagen</div><div>＋ imagen</div></div>
      </div>
    </aside>
  </div>
</div>
<script src="/static/aula122/idea-page.js"></script>
</body>
</html>
